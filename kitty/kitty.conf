# kitty.conf — mirrors ../wezterm/wezterm.lua as closely as kitty allows.
# The look & feel target is the nvim "chalk" theme (green-tinted dark) layered
# on top of the "Gruvbox dark, hard (base16)" ansi palette, matching wezterm.

# ── Fonts ───────────────────────────────────────────────────────────────────
# wezterm: font_with_fallback({ "JetBrainsMono Nerd Font", "JuliaMono" })
# NOTE: kitty only matches strictly-monospaced families, so the plain
# "JetBrainsMono Nerd Font" name is NOT found and silently falls back to Menlo.
# The "…Mono" variant is the one kitty recognizes as JetBrains Mono.
font_family      family="JetBrainsMono Nerd Font Mono" style="Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# wezterm: line_height = 1.2  (kitty expresses this as cell height %)
modify_font cell_height 120%

# JetBrainsMono Nerd Font lacks some math/arrow glyphs (e.g. U+27F9 ⟹, in
# Supplemental Arrows). JuliaMono is monospace with full math/arrow coverage,
# so map those ranges to it — the kitty equivalent of the font fallback list.
symbol_map U+2100-U+214F,U+2190-U+21FF,U+2200-U+22FF,U+2300-U+23FF JuliaMono
symbol_map U+2500-U+257F,U+2580-U+259F,U+25A0-U+25FF,U+2600-U+26FF JuliaMono
symbol_map U+27C0-U+27EF,U+27F0-U+27FF,U+2900-U+297F,U+2980-U+29FF,U+2A00-U+2AFF JuliaMono

# ── Rendering / performance ──────────────────────────────────────────────────
# wezterm: max_fps = 240, animation_fps = 240  (~4ms/frame)
repaint_delay   4
input_delay     0
# Vsync repaints to the monitor refresh: tear-free, smoother-feeling scroll.
# Costs up to one frame of latency vs. `no` — ~4ms at 240Hz, imperceptible.
sync_to_monitor yes

# ── Window ───────────────────────────────────────────────────────────────────
# wezterm: window_decorations = "RESIZE" on macOS (no title bar, still resizable)
hide_window_decorations titlebar-only

# wezterm: window_padding = { top=0, bottom=0, right=0, left=0 }
window_padding_width 0

# wezterm: config.colors.background = "rgba(24, 43, 38, 0.75)"  (#182b26 @ 75%)
background_opacity 0.9

# ── Colors: Gruvbox dark, hard (base16) with the chalk-green background ───────
foreground #d5c4a1
background #182b26

cursor            #d5c4a1
cursor_text_color #182b26

selection_foreground #1d2021
selection_background #d5c4a1

# normal
color0 #1d2021
color1 #fb4934
color2 #b8bb26
color3 #fabd2f
color4 #83a598
color5 #d3869b
color6 #8ec07c
color7 #d5c4a1
# bright
color8  #665c54
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #fbf1c7

# ── Tab bar ──────────────────────────────────────────────────────────────────
# wezterm: enable_tab_bar=true, use_fancy_tab_bar=false, tab_bar_at_bottom=true,
#          tab_max_width=32. Colors mirror colors_for_appearance() (chalk theme):
#   active   bg #1e362f fg #c3f884 (bold)   inactive bg #182b26 fg #6b7a72
tab_bar_edge       bottom
tab_bar_style      separator
tab_bar_min_tabs   1
tab_separator      " │ "
tab_title_max_length 32
# wezterm format-tab-title: " <index>: <title> "
tab_title_template " {index}: {title} "

active_tab_foreground   #c3f884
active_tab_background    #1e362f
active_tab_font_style    bold
inactive_tab_foreground #6b7a72
inactive_tab_background #182b26
tab_bar_background      #182b26

# ── Panes (splits) ───────────────────────────────────────────────────────────
enabled_layouts splits,stack

# ── Keybindings (wezterm config.keys, CMD-based on macOS) ─────────────────────
# CMD+SHIFT+r → reload config
map cmd+shift+r load_config_file

# CMD+j / CMD+k → scroll by line (wezterm ScrollByLine ±1)
map cmd+k scroll_line_up
map cmd+j scroll_line_down

# CMD+SHIFT+| → SplitHorizontal (new pane to the right → kitty vsplit)
map cmd+shift+backslash launch --location=vsplit --cwd=current
# CMD+SHIFT+- → SplitVertical (new pane below → kitty hsplit)
map cmd+shift+minus launch --location=hsplit --cwd=current

# CMD+SHIFT+h/j/k/l → move between panes/splits (wezterm ActivatePaneDirection)
map cmd+shift+h neighboring_window left
map cmd+shift+j neighboring_window down
map cmd+shift+k neighboring_window up
map cmd+shift+l neighboring_window right

# CMD+1..9 → activate tab N (wezterm's built-in ActivateTab binds; kitty has no
# default for these). {index} in the tab title is 1-based, so these line up.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# next/prev tab (kitty already binds cmd+shift+] / cmd+shift+[ by default)
